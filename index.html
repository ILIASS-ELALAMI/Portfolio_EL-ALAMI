   /* =====================================================
   DESIGN PROFIL – HEADER (SAFE & ISOLÉ)
   ===================================================== */

/* Structure du header */
header {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

/* Conteneur photo */
.profile-container {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  overflow: hidden;
  border: 4px solid #38bdf8;
  box-shadow: 0 12px 35px rgba(0,0,0,0.45);
  background: #020617;
}

/* Image profil */
.profile-container .profile-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Nom */
.profile-name {
  font-size: 2.4rem;
  font-weight: 700;
  margin-top: 10px;
}

/* Titre / rôle */
.profile-role {
  font-size: 1.1rem;
  opacity: 0.95;
}

/* Ligne décorative */
.profile-divider {
  width: 80px;
  height: 4px;
  background: #38bdf8;
  border-radius: 4px;
  margin: 10px 0 15px;
}

/* Responsive */
@media (max-width: 768px) {
  .profile-container {
    width: 120px;
    height: 120px;
  }

  .profile-name {
    font-size: 2rem;
  }
}

</head>
